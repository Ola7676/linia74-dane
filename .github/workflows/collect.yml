name: Zbieranie danych GTFS-RT linia 74

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

concurrency:
  group: gtfs-collect
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Ustaw Pythona
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Zainstaluj zależności
        run: pip install -r requirements.txt

      - name: Uruchom skrypt zbierający dane
        run: python scripts/collect.py

      - name: Zapisz zmiany w repozytorium
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add data/
          git diff --quiet && git diff --staged --quiet && exit 0
          git commit -m "Aktualizacja danych $(date -u +'%Y-%m-%d %H:%M:%S')"
          git pull --rebase origin main
          git push
